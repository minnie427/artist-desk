<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artist Desk</title>
<meta name="description" content="작가가 공모를 찾고, 지원을 관리하고, 작품·이력을 쌓아 가는 작가 워크스페이스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="color-scheme" content="light">
<style>
/* Layout: an operations app in the manner of the family's Brand OS — dark top bar, tab row, white cards on a warm grey
   ground, real tables with group rows, square-cornered controls, mono figures, a right-hand detail drawer. */
:root {
  --bg: #f3f2ee;
  --surface: #ffffff;
  --surface-2: #f7f6f2;
  --line: #e3e1db;
  --line-2: #d3d1ca;
  --ink: #1b1b1a;
  --ink-2: #5d5c58;
  --ink-3: #96948e;
  --bar: #19191a;
  --bar-ink: #f1f0ec;
  --accent: #23395b;
  --accent-2: #1a2c47;
  --on-accent: #ffffff;
  --accent-soft: #e5eaf2;
  --seal: #b23a2d;
  --seal-soft: #f8e6e2;
  --ok: #2f6b45;
  --ok-soft: #e2efe6;
  --warn: #9a6212;
  --warn-soft: #f7ecd8;
  --c-deadline: #b23a2d;
  --c-prep: #23395b;
  --c-show: #9a6212;
  --c-mine: #2f6b45;
  --scrim: rgba(15,15,15,.38);
  --shadow: 0 10px 30px rgba(0,0,0,.12);
  --shadow-1: 0 1px 2px rgba(20,20,15,.05);
  --r: 8px; --r-sm: 6px; --r-xs: 4px;
  --f-body: "Pretendard Variable", "Pretendard", "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --nav-h: 62px;
}
:root[data-theme="dark"] {
  --bg: #121212; --surface: #1b1b1c; --surface-2: #222223; --line: #2d2d2f; --line-2: #3a3a3c; --ink: #ecebe8; --ink-2: #a5a39e; --ink-3: #75736f;
  --bar: #0b0b0c; --bar-ink: #ecebe8; --accent: #9fb5dc; --accent-2: #b4c6e6; --on-accent: #10151d; --accent-soft: #232c3b; --seal: #e3806f; --seal-soft: #3a2420; --ok: #8cbd9b; --ok-soft: #1e2c23; --warn: #d9b06a; --warn-soft: #32291a;
  --c-deadline: #e3806f; --c-prep: #9fb5dc; --c-show: #d9b06a; --c-mine: #8cbd9b; --scrim: rgba(0,0,0,.6); --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(var(--nav-h) + 90px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }
h2 { font-size: 16px; line-height: 1.4; }
h3 { font-size: 15.5px; line-height: 1.45; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.empty { color: var(--ink-2); font-size: 14.5px; padding: 6px 0; }
.muted { color: var(--ink-2); }
.small { font-size: 13.5px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { background: var(--bar); color: var(--bar-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 26; }
.tb-in { max-width: 1120px; margin: 0 auto; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-size: 13px; letter-spacing: .16em; font-weight: 700; white-space: nowrap; }
.brand .ws-t { white-space: nowrap; }
.tb-tools { display: flex; gap: 6px; align-items: center; }
.tb-btn { border: 1px solid color-mix(in srgb, var(--bar-ink) 25%, transparent); background: transparent; color: var(--bar-ink); border-radius: var(--r-sm); padding: 4px 10px; font-size: 13px; font-weight: 600; cursor: pointer; }
.tb-btn:hover { border-color: var(--bar-ink); }
.mode { display: inline-flex; border: 1px solid color-mix(in srgb, var(--bar-ink) 25%, transparent); border-radius: var(--r-sm); overflow: hidden; }
.mode button { border: 0; background: none; padding: 4px 10px; font-size: 12.5px; color: color-mix(in srgb, var(--bar-ink) 65%, transparent); cursor: pointer; }
.mode button[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar); font-weight: 600; }

/* nav: tab row on wide screens, bottom bar on phones */
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 25; }
.tabs-in { max-width: 1120px; margin: 0 auto; display: flex; gap: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabs button { position: relative; display: flex; align-items: center; gap: 7px; height: 46px; padding: 0 12px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; color: var(--ink-2); font-size: 15px; font-weight: 600; }
.tabs button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--seal); color: #fff; font: 600 11px/18px var(--f-mono); text-align: center; }
@media (max-width: 759px) {
  .tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; border-bottom: 0; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabs-in { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
  .tabs button span:not(.dot) { font-size: 11.5px; }
  .tabs button { flex-direction: column; gap: 2px; height: var(--nav-h); padding: 0; justify-content: center; font-size: 12.5px; border-bottom: 0; border-top: 2px solid transparent; margin: 0; }
  .tabs button svg { width: 23px; height: 23px; }
  .tabs button[aria-selected="true"] { border-top-color: var(--ink); }
  .tabs .dot { position: absolute; top: 6px; left: calc(50% + 7px); }
}

/* page structure */
main.wrap { padding-top: 18px; }
.view { display: flex; flex-direction: column; gap: 14px; }
.page-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-h h2 { font-size: 21px; line-height: 1.3; }
.page-h .lead { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.page-h .r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.panel { box-shadow: var(--shadow-1); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel.box { border-color: var(--accent); background: var(--accent-soft); }
.p-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.p-head .k { font-size: 12.5px; color: var(--ink-2); }
.p-sub { color: var(--ink-2); font-size: 13.5px; margin-top: -4px; }
.more { background: none; border: 0; padding: 0; color: var(--accent); font-size: 13.5px; font-weight: 600; cursor: pointer; }
.more:hover { text-decoration: underline; text-underline-offset: 3px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid2 > * { min-width: 0; }
.subnote { font-size: 13px; color: var(--ink-2); margin-top: -6px; }

/* sub tabs (작가) */
.home-h { display: flex; align-items: baseline; gap: 8px; margin: 14px 0 -2px; }
.home-h h2 { font-size: 15px; font-weight: 700; margin: 0; }
.home-h .ico { width: 16px; height: 16px; align-self: center; color: var(--ink-2); }
.subnav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line); max-width: 560px; }
.approve-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px; margin: 0 0 12px; border: 1px solid var(--line); border-left: 3px solid var(--warn, #b7791f); border-radius: var(--r); background: var(--surface); font-size: 13.5px; color: var(--ink-2); }
.approve-strip .ico { width: 16px; height: 16px; flex: none; }
.approve-strip span { flex: 1 1 260px; }
.subnav button { border: 0; background: none; padding: 7px 8px; border-radius: var(--r-sm); font-size: 14.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.3; }
.subnav button small { font-size: 11px; font-weight: 500; color: var(--ink-3); }
.subnav button:hover { color: var(--ink); }
.subnav button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.subnav button[aria-pressed="true"] small { color: var(--ink-2); }

/* buttons — one system: kind (primary / secondary / success / danger / ghost / link) × size (sm / md / lg) */
.btn, .mini { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 600 14px/1 var(--f-body); height: 36px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s, color .12s; }
.btn:hover, .mini:hover { border-color: var(--ink-3); background: var(--surface-2); }
.btn svg, .mini svg { width: 16px; height: 16px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mini, .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; gap: 5px; }
.mini svg, .btn.sm svg { width: 14px; height: 14px; }
.btn.lg { height: 44px; padding: 0 18px; font-size: 15px; }
.btn.primary, .mini.ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover, .mini.ok:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.success, .mini.good { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.btn.success:hover, .mini.good:hover { filter: brightness(1.08); background: var(--ok); }
.btn.danger, .mini.danger { color: var(--seal); border-color: color-mix(in srgb, var(--seal) 35%, var(--line-2)); background: var(--surface); }
.btn.danger:hover, .mini.danger:hover { background: var(--seal-soft); border-color: var(--seal); }
.btn.ghost, .mini.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover, .mini.ghost:hover { background: var(--surface-2); color: var(--ink); border-color: transparent; }
.btn.arm { background: var(--seal); color: #fff; border-color: var(--seal); }
.btn:disabled, .mini:disabled { opacity: .45; cursor: default; pointer-events: none; }
.btn.block { width: 100%; }
.more { display: inline-flex; align-items: center; gap: 3px; background: none; border: 0; padding: 2px 0; color: var(--accent); font: 600 13.5px/1.3 var(--f-body); cursor: pointer; text-align: left; }
.more svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.more:hover { text-decoration: underline; text-underline-offset: 3px; }
.more.warn { color: var(--seal); }
.iconbtn { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--ink); padding: 0; }
.iconbtn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.iconbtn.plain { border-color: transparent; background: transparent; color: var(--ink-2); }
.iconbtn.plain:hover { background: var(--surface-2); color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navbtn { width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--ink); }
.navbtn:hover { background: var(--surface-2); }
.navbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* toggles: filter chips (many-of), segmented (one-of), stage tabs */
.chip-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; font: 600 13px/1 var(--f-body); padding: 0 11px; border-radius: var(--r-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.chip-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.chip-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip-btn .c { font: 500 11.5px var(--f-mono); opacity: .75; }
.chip-btn.kf::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--ink-3); }
.chip-btn.kf-마감::before { background: var(--c-deadline); } .chip-btn.kf-할일::before { background: var(--c-prep); } .chip-btn.kf-발표::before { background: var(--c-show); } .chip-btn.kf-개인::before { background: var(--c-mine); }
.chip-btn.kf[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink-2); }
.chip-btn.kf[aria-pressed="false"] { opacity: .5; }
.chip-btn.kf[aria-pressed="false"]::before { background: transparent; outline: 1.5px solid var(--ink-3); outline-offset: -1.5px; }
.seg2 { display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--line); }
.seg2 button { border: 0; background: none; height: 28px; padding: 0 12px; border-radius: 4px; font: 600 13px/1 var(--f-body); color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg2 button:hover { color: var(--ink); }
.seg2 button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); }
.seg2 button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 759px) {
  .btn { height: 42px; } .btn.sm, .mini { height: 36px; padding: 0 12px; } .chip-btn { height: 34px; } .seg2 button { height: 32px; }
}

/* KPI cards */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 3px; text-align: left; cursor: pointer; min-width: 0; box-shadow: var(--shadow-1); }
.kpi:hover { border-color: var(--ink-3); }
.kpi .l { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.kpi .l .ico { width: 15px; height: 15px; color: var(--ink-3); }
.kpi .n { font-family: var(--f-mono); font-size: 28px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.kpi .n small { font-family: var(--f-body); font-size: 13px; font-weight: 500; margin-left: 3px; color: var(--ink-2); }
.kpi .s { font-size: 12.5px; color: var(--ink-2); }
.kpi .go { position: absolute; top: 11px; right: 10px; color: var(--ink-3); }
.kpi .go svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.kpi.hot .s { color: var(--seal); font-weight: 600; }
.kpi.hot .s::before { content: "●"; font-size: 8px; vertical-align: 2px; margin-right: 5px; }
.ddw { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; }
.meters > .meter:first-child { border-top: 0; padding-top: 2px; }

/* tables */
.tbl-wrap { overflow-x: auto; margin: 0 -18px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl th:first-child, .tbl td:first-child { padding-left: 18px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 18px; }
.tbl th { font-size: 12px; color: var(--ink-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
.tbl td.n, .tbl th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tbl td.won { color: var(--ok); font-weight: 600; }
.tbl tr:last-child td { border-bottom: 0; }

/* call table (grid rows so it can fold to two lines on phones) */
.ctable { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.crow { display: grid; grid-template-columns: 116px minmax(0, 1fr) 118px 132px 108px 96px; gap: 0 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; cursor: pointer; font-size: 14px; }
.crow:hover { background: var(--surface-2); }
.crow.head { cursor: default; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--ink-2); padding-block: 8px; border-top: 0; }
.crow.head:hover { background: var(--surface-2); }
.cgroup { padding: 7px 16px; background: var(--surface-2); border-top: 1px solid var(--line); font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.cgroup span { font-family: var(--f-mono); font-weight: 500; margin-left: 6px; }
.crow .c-date { display: flex; flex-direction: column; gap: 1px; }
.crow .c-date .d1 { font-family: var(--f-mono); font-size: 13px; }
.crow .c-name { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.crow .c-name b { font-weight: 600; font-size: 14.5px; line-height: 1.4; }
.crow .c-name .o { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .c-name .bd { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.crow .c-cell { font-size: 13.5px; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crow .c-end { justify-self: end; text-align: right; }
@media (max-width: 860px) {
  .crow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "date end" "name name" "meta meta"; gap: 3px 10px; padding: 12px 14px; }
  .crow.head { display: none; }
  .crow .c-date { grid-area: date; flex-direction: row; gap: 8px; align-items: baseline; }
  .crow .c-name { grid-area: name; }
  .crow .c-end { grid-area: end; }
  .crow .c-fmt, .crow .c-reach, .crow .c-fee { display: none; }
  .crow .c-meta { grid-area: meta; display: block !important; }
}
.crow .c-meta { display: none; font-size: 13px; color: var(--ink-2); }

/* badges — status (filled, set by people) vs auto (outlined, set by the app) vs info tags */
.dd { display: inline-flex; align-items: center; font: 600 11.5px/1 var(--f-mono); height: 20px; padding: 0 6px; border-radius: var(--r-xs); background: var(--surface-2); color: var(--ink-2); align-self: flex-start; white-space: nowrap; border: 1px solid var(--line); }
.dd.urgent { background: var(--seal); color: #fff; border-color: var(--seal); }
.dd.hot { background: var(--seal-soft); color: var(--seal); border-color: transparent; }
.dd.soon { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.dd.plain { background: none; padding: 0; font-weight: 500; border: 0; color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; height: 20px; padding: 0 7px; border-radius: var(--r-xs); background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.tag svg { width: 11px; height: 11px; stroke: currentColor; fill: currentColor; stroke-width: 1.2; }
.tag.t-굵직 { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.tag.t-작지만 { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.auto { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; height: 20px; padding: 0 7px; border-radius: var(--r-xs); border: 1px dashed var(--line-2); color: var(--ink-2); white-space: nowrap; }
.auto.no, .auto.hot { border-style: solid; border-color: color-mix(in srgb, var(--seal) 45%, transparent); color: var(--seal); }
.auto.hot { font-weight: 600; background: var(--seal-soft); }
.auto.ok { border-style: solid; border-color: color-mix(in srgb, var(--ok) 45%, transparent); color: var(--ok); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; height: 22px; padding: 0 8px; border-radius: var(--r-xs); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-검토 { background: var(--surface-2); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
.s-준비 { background: var(--accent-soft); color: var(--accent); }
.s-제출 { background: var(--warn-soft); color: var(--warn); }
.s-선정 { background: var(--ok-soft); color: var(--ok); }
.s-탈락, .s-보류, .s-패스 { background: var(--surface-2); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.elig { display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; height: 20px; padding: 0 7px; border-radius: var(--r-xs); }
.e-해당 { background: var(--ok-soft); color: var(--ok); }
.e-확인 { background: var(--warn-soft); color: var(--warn); }
.e-불가 { background: var(--seal-soft); color: var(--seal); }
.mat { font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: var(--r-xs); margin-left: 6px; }
.mat.have { background: var(--ok-soft); color: var(--ok); }
.mat.need { background: var(--warn-soft); color: var(--warn); }
.prog { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog i { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.prog i b { display: block; height: 100%; background: var(--accent); }
.prog.full i b { background: var(--ok); }
.meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cnt-b { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font: 600 11.5px var(--f-mono); color: var(--ink-2); vertical-align: 2px; margin-left: 6px; }
.cnt-b.hot { background: var(--seal); border-color: var(--seal); color: #fff; }
/* info button: tap shows the explanation */
.info { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; border: 0; background: none; color: var(--ink-3); cursor: help; padding: 0; vertical-align: -3px; margin-left: 4px; }
.info:hover { color: var(--accent); }
.info svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

/* lists inside cards */
.rows { display: flex; flex-direction: column; margin: 0 -18px; }
.row { display: flex; gap: 12px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-act { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.frow { grid-template-columns: 104px minmax(0, 1fr) 200px 84px 96px 150px; cursor: default; }
.frow .c-name a { color: inherit; text-decoration: none; display: inline-flex; gap: 4px; align-items: baseline; }
.frow .c-name a:hover b { text-decoration: underline; }
.frow .c-name a .ico { width: 12px; height: 12px; color: var(--ink-3); flex-shrink: 0; }
.frow .bd { display: flex; gap: 4px; flex-wrap: wrap; white-space: normal; }
.fstat .fs-row { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
.fstat .fs-c { flex: 1 1 120px; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--surface-2); }
.fstat .fs-c b { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fstat .fs-c span { font-size: 13px; font-weight: 600; }
.fstat .fs-c small { font-size: 12px; color: var(--ink-2); }
.fstat .fs-c small.def { color: var(--ink-3); font-size: 11.5px; line-height: 1.4; margin-top: 2px; }
.tag.fit-상 { background: var(--ok-soft, #e6f4ea); color: var(--ok); border-color: transparent; }
.tag.fit-중 { background: var(--surface-2); color: var(--ink-2); }
.tag.fit-하 { background: var(--surface-2); color: var(--ink-3); }
.fitcell { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.seg2.subseg { flex-wrap: wrap; align-self: flex-start; margin: -2px 0 2px; }
.fstat .fs-arr { display: flex; align-items: center; color: var(--ink-3); }
.fstat .fs-arr svg { width: 14px; height: 14px; }
.fstat .fs-src { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.prop-g { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.prop-h { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.prop-h .r { margin-left: auto; display: flex; gap: 6px; }
.prop-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.prop-bar .r { margin-left: auto; display: flex; gap: 6px; }
.chk-row.prop .ttl { color: var(--ink-2); }
.fmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; margin: 4px 0 10px; }
.fmap .fm { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: inherit; background: var(--surface-2); }
.fmap .fm:hover { border-color: var(--line-2); background: var(--surface); }
.fmap .fm b { font-size: 13.5px; display: flex; gap: 6px; align-items: center; }
.fmap .fm .ico { width: 14px; height: 14px; color: var(--ink-3); }
.fmap .fm span { font-size: 12px; color: var(--ink-2); }
@media (max-width: 759px) {
  .frow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "date end" "name name" "bd bd"; }
  .frow .bd { grid-area: bd; display: flex !important; }
  .frow .c-cell:not(.bd) { display: none; }
  .fstat .fs-arr { display: none; }
  .fstat .fs-c { flex-basis: calc(50% - 6px); }
}
.linkish { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 14.5px; cursor: pointer; line-height: 1.45; color: var(--ink); }
.linkish:hover { color: var(--accent); }
.row-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.chk-row { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); }
.chk-row input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex-shrink: 0; }
.chk-row .t { flex: 1; min-width: 0; }
.chk-row.done .ttl { text-decoration: line-through; color: var(--ink-3); }
.chk-row small { display: block; color: var(--ink-2); font-size: 12.5px; }

/* alerts */
.alerts { display: flex; flex-direction: column; margin: 0 -18px; }
.alert { display: grid; grid-template-columns: 30px 1fr 18px; gap: 10px; align-items: center; padding: 10px 18px; border: 0; border-top: 1px solid var(--line); text-align: left; background: none; width: 100%; cursor: pointer; color: var(--ink); }
.alert:hover { background: var(--surface-2); }
.alert .a-ic { width: 30px; height: 30px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--ink-2); }
.alert .a-ic svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.alert.urgent .a-ic { background: var(--seal-soft); color: var(--seal); }
.alert.check .a-ic { background: var(--warn-soft); color: var(--warn); }
.alert.news .a-ic { background: var(--accent-soft); color: var(--accent); }
.alert .a-main { min-width: 0; display: flex; flex-direction: column; }
.alert .a-main b { font-weight: 600; font-size: 14px; }
.alert .a-main span { font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert .go { color: var(--ink-3); display: flex; }
.alert .go svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

/* meters */
.meter { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); text-align: left; background: none; width: 100%; }
.meter:first-child { border-top: 0; }
.meter .mn { font-weight: 600; font-size: 14.5px; }
.meter .mc { font-family: var(--f-mono); font-size: 13px; }
.meter .track { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.meter .fill { height: 100%; background: var(--accent); }
.meter.done .fill { background: var(--ok); }
.meter .ms { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.meter .nx { grid-column: 1 / -1; font-size: 13px; }

/* insights */
.ins { display: flex; flex-direction: column; margin: 0 -18px; }
.in { display: grid; grid-template-columns: 4px 1fr; gap: 12px; padding: 10px 18px 10px 18px; border-top: 1px solid var(--line); }
.in .bar { border-radius: 2px; background: var(--accent); height: auto; border: 0; position: static; }
.in.warn .bar { background: var(--seal); }
.in.good .bar { background: var(--ok); }
.in .t { font-weight: 600; font-size: 14.5px; }
.in .b { font-size: 13.5px; color: var(--ink-2); }
.in .a { margin-top: 3px; }
.in .tagline { font-size: 11.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .04em; }

/* months */
.months { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mon { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer; min-width: 0; }
.mon:hover { border-color: var(--ink-3); }
.mon .mh { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.mon .mh b { font-size: 15px; }
.mon .load { height: 6px; display: flex; gap: 2px; }
.mon .load i { display: block; height: 100%; background: var(--accent); border-radius: 1px; }
.mon .load i.over { background: var(--seal); }
.mon ul { margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 1px; }
.mon ul li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mon .st { font-size: 12.5px; color: var(--ink-2); }
.mon .st.warn { color: var(--seal); font-weight: 600; }

/* budget */
.bar { position: relative; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.bar .fill.paid { background: var(--ok); }
.bar .mark { position: absolute; top: -5px; bottom: -5px; width: 0; border-left: 1px dashed var(--ink-2); }
.bar-scale { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); }
.big { font-family: var(--f-mono); font-size: 22px; font-weight: 600; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* mail */
.mail { display: flex; flex-direction: column; margin: 0 -18px; }
.mail a { display: flex; flex-direction: column; gap: 1px; padding: 9px 18px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; min-width: 0; }
.mail a:hover { background: var(--surface-2); }
.mail .mtop { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.mail .mtop span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mail .ms { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.mail .sn { font-size: 13px; color: var(--ink-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.notice { font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

/* filters */
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.toolbar .l { flex: 1 1 240px; }
.toolbar .l .search { width: 100%; max-width: 360px; }
.toolbar .l, .toolbar .r { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.seg-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.seg-tabs button { border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; padding: 8px 14px; cursor: pointer; display: flex; align-items: baseline; gap: 7px; color: var(--ink-2); white-space: nowrap; }
.seg-tabs button .l { font-weight: 600; font-size: 14.5px; }
.seg-tabs button .n { font-family: var(--f-mono); font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-xs); padding: 0 5px; }
.seg-tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.seg-tabs button[aria-pressed="true"] .n { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.catbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.fbar { display: flex; gap: 6px; flex-wrap: wrap; }
.fbar select, .search { font: 14px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px 8px; min-width: 0; }
.fbar label { display: contents; }
.fbar label .lt { display: none; }
.search { width: 260px; max-width: 100%; padding: 7px 10px; }
.searchrow { display: contents; }
.hint { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fold { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.fold > summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: baseline; padding: 11px 16px; font-weight: 600; font-size: 14.5px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: "▸"; color: var(--ink-3); font-size: 12px; }
.fold[open] > summary::before { content: "▾"; }
.fold > summary .s { font-weight: 400; font-size: 13px; color: var(--ink-2); margin-left: auto; text-align: right; }
.fold .ctable { border: 0; border-radius: 0; }
.fold > .empty { padding: 4px 16px 12px; }
.qadd { display: flex; gap: 6px; flex-wrap: wrap; }
.qadd button { display: inline-flex; align-items: center; gap: 5px; height: 30px; font: 600 13px/1 var(--f-body); padding: 0 10px; border-radius: var(--r-sm); border: 1px dashed var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; }
.qadd button svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--ink-2); }
@media (max-width: 759px) { .qadd button { height: 36px; } }
.qadd button:hover { border-style: solid; border-color: var(--ink-2); }
.qadd .lbl { font-size: 12.5px; color: var(--ink-2); align-self: center; margin-right: 2px; }
.active-f { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: 3px 4px 3px 10px; border-radius: var(--r-sm); }
.active-f button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 13px; padding: 0 4px; }

/* calendar */
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cal-nav { display: flex; align-items: center; gap: 6px; }
.cal-nav h2 { min-width: 6.5em; text-align: center; font-family: var(--f-mono); font-size: 17px; font-weight: 600; }
.calwrap { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) 64px; }
.cal .dow { font-size: 12px; font-weight: 600; color: var(--ink-2); text-align: center; padding: 7px 0; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.cal .dow.sun { color: var(--seal); }
.cal .wk-h, .cal .wkl { font-size: 11.5px; color: var(--ink-2); text-align: center; background: var(--surface-2); border-left: 1px solid var(--line); }
.cal .wkl { border-top: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; gap: 2px; }
.cal .wkl b { font-family: var(--f-mono); font-size: 16px; color: var(--ink); }
.cal .wkl b.over { color: var(--seal); }
.cal .wkl span { font-size: 11px; white-space: nowrap; }
.cal .wkl b { font-size: 14px; }
.cal .wkl.over b { color: var(--seal); }
.wk-day { border-bottom: 1px solid var(--line); padding: 6px 0; }
.wk-day:last-child { border-bottom: 0; }
.wk-day.today h3 { color: var(--accent); }
.cell { min-height: 96px; border: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 2px; background: var(--surface); text-align: left; cursor: pointer; min-width: 0; }
.cell.c0 { border-left: 0; }
.cell:hover { background: var(--surface-2); }
.cell.out { background: var(--surface-2); color: var(--ink-3); }
.cell.today { background: var(--accent-soft); }
.cell.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.cell .dn { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; padding: 0 2px; }
.cell.today .dn { color: var(--accent); }
.ev { font-size: 11.5px; line-height: 1.35; padding: 1px 4px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--surface-2); color: var(--ink); border-left: 3px solid var(--ink-3); }
.ev.k-마감 { border-left-color: var(--c-deadline); background: var(--seal-soft); }
.ev.k-준비, .ev.k-할일 { border-left-color: var(--c-prep); background: var(--accent-soft); }
.ev.k-개인 { border-left-color: var(--c-mine); background: var(--ok-soft); }
.ev.k-발표, .ev.k-전시 { border-left-color: var(--c-show); background: var(--warn-soft); }
.ev.done { opacity: .45; text-decoration: line-through; }
.ev-more { font-size: 11px; color: var(--ink-2); padding-left: 3px; }
@media (max-width: 700px) {
  .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal .wk-h, .cal .wkl { display: none; }
  .cell { min-height: 64px; padding: 2px; }
  .ev { font-size: 0; height: 5px; padding: 0; border-left: 0; border-radius: 2px; background: var(--ink-3); }
  .ev.k-마감 { background: var(--c-deadline); } .ev.k-준비, .ev.k-할일 { background: var(--c-prep); } .ev.k-개인 { background: var(--c-mine); } .ev.k-발표, .ev.k-전시 { background: var(--c-show); }
  .ev-more { font-size: 10px; }
  .cell { gap: 3px; }
}
.agenda { display: flex; flex-direction: column; margin: 0 -18px; }
.ag { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 9px 18px; border-top: 1px solid var(--line); align-items: start; }
.ag .d { font-family: var(--f-mono); font-size: 13px; font-weight: 600; padding-top: 2px; }
.ag .d small { display: block; font-family: var(--f-body); font-weight: 400; color: var(--ink-2); font-size: 11.5px; }
.ag .d.late { color: var(--seal); }
.ag .b { min-width: 0; display: flex; gap: 10px; align-items: flex-start; }
.ag .b input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex-shrink: 0; }
.ag .b > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.kchip.k-마감 { background: var(--seal-soft); color: var(--seal); } .kchip.k-준비, .kchip.k-할일 { background: var(--accent-soft); color: var(--accent); } .kchip.k-개인 { background: var(--ok-soft); color: var(--ok); } .kchip.k-발표, .kchip.k-전시 { background: var(--warn-soft); color: var(--warn); }

  async function planPrep(c) {
    if (linkedTasks(c._id).length) return;
    const fmtName = fmtOf(c) || "강의·협업·기타";
    // '선정 후', '성과보고', '교부·정산' 같은 것은 접수 준비가 아니라 빼고 만든다
    const POST = /선정\s*(후|시|되면)|성과\s*보고|결과\s*보고|교부|정산|협약|납본|선정자/;
    const fromCall = (Array.isArray(c.requirements) ? c.requirements : []).filter((t) => !POST.test(t));
    const reqs = (fromCall.length ? fromCall : PREP[fmtName] || ["필요 서류 확인"]).slice(0, 10);
    const end = c.deadline || (c.expected ? c.expected + "-20" : null);
    const lst = reqs.map((t) => ({ title: t })).concat([{ title: "최종 점검 후 접수", final: true }]);
    const n = lst.length;
    let dues = lst.map(() => null);
    if (end) {
      const left = Math.max(0, dday(end));
      const finalDue = left >= 1 ? addDays(-1, end) : end;
      const span = Math.max(0, left - 3);
      const step = Math.max(1, Math.min(7, Math.floor(span / Math.max(1, n - 1))));
      dues = lst.map((x, i) => {
        if (x.final) return finalDue;
        const d = addDays(-(3 + (n - 2 - i) * step), end);
        return d < TODAY ? TODAY : (d > finalDue ? finalDue : d);
      });
    }
    for (let i = 0; i < n; i++) {
      const mat = matchMaterial(lst[i].title);
      const t = { title: lst[i].title };
      await db.collection("tasks").add({
        title: lst[i].title, due: dues[i], done: false, goal: c.goal || null, callId: c._id, callName: c.name, cat: lst[i].final ? "자료" : catOf(t),
        auto: true, proposed: true, material: mat, estimated: !c.deadline, createdAt: stamp(), updatedAt: stamp()
      });
    }
  }
